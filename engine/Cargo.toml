# Sieve's filtering engine (docs/plans/2026-10-17-https-filtering.md, 1.2).
# A separate workspace from src-tauri: it builds and is tested while src-tauri
# is being edited, keeps its own target dir and never links Tauri.
#   sieve-ipc     the pipe protocol (no Windows calls), shared with src-tauri
#   sieve-filter  lists, rule engine, exclusions, resource pin (pure)
#   sieve-engine  the Windows service: flow decoding today, the TUN later
[workspace]
resolver = "3"
members = ["crates/sieve-ipc", "crates/sieve-filter"]
exclude = ["vendor/ipstack"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
proptest = "1"
windows = { version = "0.62" }

# ipstack's upstream build.rs copied wintun.dll into target/ on every Windows
# build. The vendored copy has no build script (see its Cargo.toml).
[patch.crates-io]
ipstack = { path = "vendor/ipstack" }

[profile.release]
debug = 1
