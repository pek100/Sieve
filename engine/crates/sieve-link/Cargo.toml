[package]
name = "sieve-link"
description = "Trusted links: a device's TCP traffic exits through a paired hub (portable core, SDK seed)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Its own licence, separate from the GPL engine: see README.md and LICENSE.
# Apache-2.0 is a PLACEHOLDER until the owner chooses (MIT or Apache-2.0).
license = "Apache-2.0"
publish.workspace = true

# This crate must not depend on sieve-engine, sieve-filter or sieve-ipc, nor
# contain code copied from them: it is licensed apart from the engine.

[lib]
name = "sieve_link"
path = "src/lib.rs"

[[bin]]
name = "sieve-hub"
path = "src/bin/sieve-hub.rs"

[[bin]]
name = "sieve-link"
path = "src/bin/sieve-link.rs"

[dependencies]
# TLS 1.3 only, raw public keys (RFC 7250) pinned from pairing, aws-lc-rs with
# X25519MLKEM768 preferred: the same provider and preference as the engine.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
# Stream multiplexing with per-stream flow control (libp2p's yamux).
yamux = "0.14"
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
data-encoding = "2"
socket2 = "0.6"
# Wipes our own copies of key bytes and pairing secrets when dropped.
zeroize = "1"
# Reads a pairing code at a prompt without echoing it.
rpassword = "7"

# Interface list (GetAdaptersAddresses), file identity, and the owner-only
# DACL on the store directory and its files.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

# getifaddrs, geteuid.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
