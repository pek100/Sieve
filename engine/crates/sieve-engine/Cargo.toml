[package]
name = "sieve-engine"
description = "Sieve's filtering engine, a Windows service (plan 1.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sieve_engine"
path = "src/lib.rs"

[[bin]]
name = "sieve-engine"
path = "src/main.rs"

# The spike's live probe (one test host routed into a Wintun adapter, run by
# the user elevated). Kept as a developer tool for slice 3; never bundled.
[[bin]]
name = "probe"
path = "src/bin/probe/main.rs"

# Include the offline CONNECT parser/JSON tests in cargo test --workspace.
[[example]]
name = "connect_relay"
test = true

[features]
# The Stall test build (plan 7.2, slice 3 live check): 30 s after its routes
# come up, the relay stops answering the watchdog's pings, so the watchdog
# deletes the routes and exits. Never bundled: `pnpm engine:build` builds
# without it.
stall = []
# Bounded, admin-only attribution evidence for a short diagnostic run.
# Off in the production build; never changes an attribution decision.
attribution-diagnostics = []
# Restart-only relay CPU experiments, absent from production builds.
relay-experiments = []
# Slice 7's live check only (task D10): reads `live-scope.json` at start, so a
# client that is no browser can be intercepted and heal. Never in a release.
live-scope = []

[dependencies]
sieve-filter = { path = "../sieve-filter" }
sieve-ipc = { path = "../sieve-ipc", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url = "2.5"

# Content injection (inject/): streaming decode, the HTML rewriter (bounded
# memory, BSD-3-Clause) and the response head types slice 6 gets through hyper.
base64 = "0.22"
brotli-decompressor = "6"
encoding_rs = "0.8"
flate2 = "1"
getrandom = "0.3"
http = "1"
lol_html = "3"
zstd = { version = "0.14", default-features = false }

# QUIC Initial protection (RFC 9001 section 5): HKDF-SHA256 for the initial
# secrets, AES-128-GCM for the payload, AES-128-ECB for header protection.
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2.workspace = true

# Signed updates (plan 7.5): verifies minisign signatures, no dependencies of
# its own. Signing exists only in tests (dev-dependency `minisign`).
minisign-verify = "0.2.5"
# The default lists' download (lists/https.rs only): rustls on aws-lc-rs with
# X25519MLKEM768 preferred, hyper for chunked HTTP/1.1, webpki-roots as the
# trust store (never the Windows store a local filter can write to). The same
# TLS stack as the encrypted DNS stream, so one client config survives (S29).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# hyper's own h2, named only for the reason a stream is refused with (`http::serve`).
h2 = "0.4"
webpki-roots = "1"
# Slice 6: the trust half of upstream validation (plan 2.6), Windows' chain
# engine, called off the runtime (task D2). Offline tests never call it (D3).
rustls-platform-verifier = "0.7"
bytes = "1"

# Userspace TCP/IP stack (vendored, see engine/vendor/ipstack/Cargo.toml).
ipstack = "1.0.1"
socket2 = "0.6"
# The packets a refused QUIC flow is answered with (`quic::icmp`): the version
# and features ipstack builds every packet it writes with. Also the benchmark's.
etherparse = { version = "0.20", default-features = false, features = ["std"] }

# Encrypted DNS upstreams (plan 1.4) and the one TLS owner (plan 2.7, `tls`):
# rustls on aws-lc-rs, X25519MLKEM768 preferred. hyper speaks DoH over HTTP/2,
# quinn speaks DoQ. webpki-roots is the resolver trust store (never the Windows
# verifier, whose network fetches would wait on this engine's own DNS).
quinn = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "runtime-tokio"] }
# The root CA and its leaves (plan 2.1, 2.5). rcgen builds the certificates
# with a signer the CNG key sits behind (`rcgen::SigningKey`); x509-parser
# reads back the root the store holds. aws-lc-rs is the one crypto provider
# (plan 2.7), with its prebuilt NASM objects: this machine has CMake and no
# NASM (probe of 2026-11-05). sha1 is the store's identity, the thumbprint.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "x509-parser"] }
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
# The DER wrapper rcgen's issuer takes (rcgen does not re-export it).
rustls-pki-types = "1"
time = { version = "0.3", features = ["parsing"] }
sha1 = "0.10"
x509-parser = "0.18"
# Slice 11 (task D5, D6): the path eligibility accepts, for the issuer's key;
# Mozilla's CRLite format (MPL-2.0), since the published data left cascades.
rustls-webpki = "0.103"
clubcard-crlite = "0.6"

# Windows calls. The library reads the owner-pid tables, process images and
# session ids, the adapter and forwarding tables and AdGuard's service state,
# serves the pipe (Pipes, Security_Authorization for its DACL), watches route
# changes (NotifyRouteChange2), and, as the service, creates its Wintun
# adapter with its addresses and routes in the active store only (route::apply,
# the one writer), restricts DLL loading to System32 (LibraryLoader). For the
# verbs run elevated by the installer or a person: the service registration
# (Services, through windows-service for the rest), the ProgramData ACL, and
# the deletion of routes on the "Sieve" interface and in the journal. The
# probe binary alone creates the spike's test adapter (run by the user).
# Attribution reads: a real-time ETW session (Diagnostics_Etw, Time) and WMI
# queries of NAT state on its own COM thread (Com, Ole for VARIANT, Rpc,
# Variant, Wmi).
# The root CA (`ca::win`, plan 2.2, 2.3): its CNG key and the machine root
# store (Security_Cryptography), the Firefox policy value (System_Registry).
[target.'cfg(windows)'.dependencies]
# Loads wintun.dll at run time (libloading); verify_binary_signature refuses
# a DLL whose Authenticode signer is not "WireGuard LLC".
wintun-bindings = { version = "0.7.40", features = ["verify_binary_signature"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Rpc",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
# The SCM dispatcher and service configuration (MIT or Apache-2.0).
windows-service = "0.8.1"

[dev-dependencies]
# Tests sign with the real tool, with a key pair generated in memory (update::testing).
minisign = "0.8.0"
proptest.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
# Loopback resolvers for the encrypted DNS tests (`dns::testing`) and a CA the
# update client does not trust (`update::https`).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
hyper = { version = "1", features = ["server"] }
# A body fed from a test, for streaming and trailers (`http::tests`).
http-body-util = { version = "0.1", features = ["channel"] }
# The test encoder for the brotli decode path.
brotli = "8"
# Real CRLite filters for tests (`tls::crlite::testing`).
clubcard = { version = "0.3", features = ["builder"] }
clubcard-crlite = { version = "0.6", features = ["builder"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
