[package]
name = "sieve"
version = "0.1.0"
description = "Sieve: see which apps on this computer are talking to the network"
authors = ["Michael"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "sieve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tauri = { version = "2.12.4" }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

# DNS filter engine (src/dns): message parsing, the proxy's sockets and
# the runtime list download (OS TLS stack, no bundled crypto).
hickory-proto = "0.26"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tempfile = "3"

# Read-only Windows calls for the connection source (slice S1): the IP Helper
# owner-pid tables, process image names and file version info. No writes.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
