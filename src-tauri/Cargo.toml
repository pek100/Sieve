[package]
name = "sieve"
version = "0.1.0"
description = "Sieve: see which apps on this computer are talking to the network"
authors = ["Michael"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "sieve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tauri = { version = "2.12.4", features = ["tray-icon"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# Opens a list's public issue page in the default browser (Report a broken site).
tauri-plugin-opener = "2"

# The pipe to the engine (src/engine.rs): named pipes, frames, timeouts.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

# The engine's pipe protocol (src/engine.rs), shared with the engine workspace.
sieve-ipc = { path = "../engine/crates/sieve-ipc", features = ["tokio"] }

# App icons (src/icons): the shell's icon of an exe, encoded as PNG for the UI.
png = "0.18"

# The filter catalogue and the rule parser (src/filters.rs): the engine's one
# table and one parser, read here so the app never copies either.
sieve-filter = { path = "../engine/crates/sieve-filter" }

# The settings password (src/lock.rs): Argon2id, hash kept in the app data dir.
argon2 = "0.6.0"

# Desktop notifications, only when the user turns the setting on.
tauri-plugin-notification = "2.8.0"

[dev-dependencies]
tempfile = "3"

# Argon2id at its OWASP parameters is many times slower unoptimised, in tests and dev builds alike.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Windows calls, all read only (Sieve never writes system network state):
# the IP Helper owner-pid tables, process image names and file version info
# (slice S1); the service list, for the service names of a process whose exe
# Windows hides (EnumServicesStatusExW with SC_MANAGER_ENUMERATE_SERVICE, no
# admin); adapter DNS servers (GetAdaptersAddresses, windns); app icons (icons:
# SHCreateItemFromParsingName and IShellItemImageFactory under COM, the
# bitmap read with GetDIBits).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
