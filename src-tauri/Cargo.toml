[package]
name = "sieve"
version = "0.1.0"
description = "Sieve: see which apps on this computer are talking to the network"
authors = ["Michael"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "sieve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tauri = { version = "2.12.4" }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
