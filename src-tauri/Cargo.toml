[package]
name = "sieve"
version = "0.1.0"
description = "Sieve: see which apps on this computer are talking to the network"
authors = ["Michael"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "sieve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tauri = { version = "2.12.4", features = ["tray-icon"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

# DNS filter engine (src/dns): message parsing, the proxy's sockets and
# the runtime list download (OS TLS stack, no bundled crypto).
hickory-proto = "0.26"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

# App icons (src/icons): the shell's icon of an exe, encoded as PNG for the UI.
png = "0.18"

[dev-dependencies]
tempfile = "3"

# Windows calls. Read only: the IP Helper owner-pid tables, process image
# names and file version info (slice S1); the service list, for the
# service names of a process whose exe Windows hides (EnumServicesStatusExW
# with SC_MANAGER_ENUMERATE_SERVICE, no admin); adapter DNS servers
# (GetAdaptersAddresses), the Tcpip NameServer registry values and the process
# list (sysdns); app icons (icons: SHCreateItemFromParsingName and
# IShellItemImageFactory under COM, the bitmap read with GetDIBits). The one write: sysdns runs one PowerShell script elevated
# (ShellExecuteExW "runas", the user approves the UAC prompt).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
