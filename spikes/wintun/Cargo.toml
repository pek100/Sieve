# Feasibility spike: per-app filtering through a Wintun TUN adapter (see
# docs/research/2026-10-17-wintun-spike.md). Standalone on purpose: not a
# member of src-tauri, its own lock file and its own target dir.
[package]
name = "sieve-wintun-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"
description = "Spike: per-flow domain decoding (TLS SNI, HTTP Host, QUIC Initial) and per-app verdicts over a Wintun TUN"

# Its own workspace root, so cargo never walks up into another manifest.
[workspace]

[lib]
name = "spike"
path = "src/lib.rs"

[dependencies]
# QUIC Initial protection (RFC 9001 section 5): HKDF-SHA256 for the initial
# secrets, AES-128-GCM for the payload, AES-128-ECB for header protection.
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# Read-only Windows calls: owner-pid tables (IP Helper), process image path.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = "1"

[profile.release]
debug = 1
