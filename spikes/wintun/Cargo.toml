# Feasibility spike: per-app filtering through a Wintun TUN adapter (see
# docs/research/2026-10-17-wintun-spike.md). Standalone on purpose: not a
# member of src-tauri, its own lock file and its own target dir.
[package]
name = "sieve-wintun-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"
description = "Spike: per-flow domain decoding (TLS SNI, HTTP Host, QUIC Initial) and per-app verdicts over a Wintun TUN"

# Its own workspace root, so cargo never walks up into another manifest.
[workspace]

[lib]
name = "spike"
path = "src/lib.rs"

[dependencies]
# QUIC Initial protection (RFC 9001 section 5): HKDF-SHA256 for the initial
# secrets, AES-128-GCM for the payload, AES-128-ECB for header protection.
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# Probe only: async runtime, userspace TCP/IP stack, Wintun loader, report.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
ipstack = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"

# Windows calls. Read only for the library (owner-pid tables, process image
# path). The probe binary alone also creates the adapter, its address and
# its test routes (elevated, run by the user, removed on exit).
[target.'cfg(windows)'.dependencies]
# Loads wintun.dll at run time (libloading); verify_binary_signature refuses
# a DLL whose Authenticode signer is not "WireGuard LLC".
wintun-bindings = { version = "0.7.40", features = ["verify_binary_signature"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Threading",
] }

[[bin]]
name = "probe"
path = "src/bin/probe/main.rs"

[dev-dependencies]
proptest = "1"
# Benchmark only: craft packets for ipstack (same version ipstack uses).
etherparse = "0.20"

[profile.release]
debug = 1
